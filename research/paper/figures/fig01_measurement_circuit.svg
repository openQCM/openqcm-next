<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Helvetica, Arial, sans-serif">
  <title>openQCM NEXT impedance measurement: the quartz sensor in a divider with R17, read by the AD8302</title>
  <!-- Drawn after docs/schematic/openQCM_NEXT_A4.pdf (rev. 3.0): blocks 03 (QCM drive), 04 (detection and outputs). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/>
    </marker>
    <g id="gnd" stroke-width="1.6" stroke-linecap="round">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-7.5" y1="5" x2="7.5" y2="5"/>
      <line x1="-3" y1="10" x2="3" y2="10"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="539" rx="10" fill="#ffffff" stroke="#e4e3df"/>

  <!-- ============ neutral wiring ============ -->
  <g fill="none" stroke="#3a3a38" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- drive chain to QCM_IN -->
    <path d="M200,80 H225"/>
    <path d="M275,80 H300"/>
    <path d="M308,80 H335"/>
    <path d="M385,80 H480"/>
    <!-- attenuator and INPB -->
    <path d="M540,80 H690"/>
    <path d="M640,80 V110"/>
    <path d="M640,166 V190"/>
    <path d="M698,80 H760"/>
    <!-- INPA -->
    <path d="M698,400 H760"/>
    <!-- outputs, amplifiers, ADC -->
    <path d="M890,170 H930"/>
    <path d="M985,170 H1040"/>
    <path d="M890,310 H930"/>
    <path d="M985,310 H1040"/>
  </g>
  <g stroke="#3a3a38"><use href="#gnd" x="640" y="190"/></g>

  <!-- ============ the measuring divider, highlighted ============ -->
  <g fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M420,80 V220"/>
    <path d="M420,260 V400 H450"/>
    <path d="M500,400 H540"/>
    <path d="M590,400 H690"/>
    <path d="M640,400 V420"/>
    <path d="M640,476 V494"/>
  </g>
  <g stroke="#2a78d6"><use href="#gnd" x="640" y="494"/></g>

  <!-- junctions -->
  <g fill="#3a3a38">
    <circle cx="420" cy="80" r="3.8"/>
    <circle cx="640" cy="80" r="3.6"/>
  </g>
  <circle cx="640" cy="400" r="3.8" fill="#2a78d6"/>

  <!-- drive chain -->
  <rect x="20" y="46" width="180" height="68" rx="6" fill="#f6f6f4" stroke="#3a3a38" stroke-width="1.6"/>
  <text x="110" y="68" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="middle">DDS AD9851</text>
  <text x="110" y="85" font-size="10.5" fill="#52514e" text-anchor="middle">LC reconstruction filter</text>
  <text x="110" y="100" font-size="10.5" fill="#52514e" text-anchor="middle">AD5252 level · Q1/Q2 driver</text>
  <rect x="225" y="72" width="50" height="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="250" y="62" font-size="12" fill="#0b0b0b" text-anchor="middle">R<tspan font-size="9" dy="3">7</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">50 Ω</tspan></text>
  <g stroke="#1f1f1e" stroke-width="2"><line x1="300" y1="66" x2="300" y2="94"/><line x1="308" y1="66" x2="308" y2="94"/></g>
  <text x="304" y="112" font-size="12" fill="#0b0b0b" text-anchor="middle">C<tspan font-size="9" dy="3">7</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">10 µF</tspan></text>
  <rect x="335" y="72" width="50" height="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="360" y="62" font-size="12" fill="#0b0b0b" text-anchor="middle">R<tspan font-size="9" dy="3">37</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">0 Ω</tspan></text>
  <text x="420" y="62" font-size="12" fill="#0b0b0b" text-anchor="middle">QCM_IN</text>
  <text x="420" y="46" font-size="12" fill="#0b0b0b" text-anchor="middle" font-style="italic">V<tspan font-size="9" dy="3">in</tspan></text>

  <!-- R11 (series) and R19 (shunt): the INPB attenuator -->
  <rect x="480" y="72" width="60" height="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="510" y="62" font-size="12" fill="#0b0b0b" text-anchor="middle">R<tspan font-size="9" dy="3">11</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">47 Ω</tspan></text>
  <rect x="632" y="110" width="16" height="56" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="656" y="134" font-size="12" fill="#0b0b0b">R<tspan font-size="9" dy="3">19</tspan></text>
  <text x="656" y="151" font-size="10.5" fill="#52514e">4.99 Ω</text>
  <text x="555" y="120" font-size="10.5" fill="#8a8984" text-anchor="middle"><tspan x="555" dy="0">INPB attenuator</tspan><tspan x="555" dy="14">(R11+R19)/R19, 20.36 dB</tspan></text>

  <!-- C19 -->
  <g stroke="#1f1f1e" stroke-width="2"><line x1="690" y1="64" x2="690" y2="96"/><line x1="698" y1="64" x2="698" y2="96"/></g>
  <text x="694" y="54" font-size="12" fill="#0b0b0b" text-anchor="middle">C<tspan font-size="9" dy="3">19</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">1 nF</tspan></text>

  <!-- the sensor, off board on J2 -->
  <rect x="352" y="146" width="136" height="194" rx="8" fill="none" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="356" y="138" font-size="10.5" fill="#8a8984">sensor, on connector J2</text>
  <g fill="#ffffff" stroke="#3a3a38" stroke-width="1.4">
    <circle cx="420" cy="170" r="4"/>
    <circle cx="420" cy="316" r="4"/>
  </g>
  <text x="408" y="174" font-size="10" fill="#52514e" text-anchor="end">J2-2</text>
  <text x="408" y="320" font-size="10" fill="#52514e" text-anchor="end">J2-11</text>
  <g stroke="#1f1f1e" stroke-width="1.8">
    <line x1="398" y1="220" x2="442" y2="220"/>
    <line x1="398" y1="260" x2="442" y2="260"/>
  </g>
  <rect x="406" y="228" width="28" height="24" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="452" y="238" font-size="13" fill="#0b0b0b">Z<tspan font-size="10" dy="3">q</tspan></text>
  <text x="452" y="254" font-size="10.5" fill="#52514e">quartz</text>
  <text x="432" y="360" font-size="12" fill="#0b0b0b">QCM_OUT</text>

  <!-- return path: R38, R12 -->
  <rect x="450" y="392" width="50" height="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="475" y="384" font-size="12" fill="#0b0b0b" text-anchor="middle">R<tspan font-size="9" dy="3">38</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">0 Ω</tspan></text>
  <rect x="540" y="392" width="50" height="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.8"/>
  <text x="565" y="384" font-size="12" fill="#0b0b0b" text-anchor="middle">R<tspan font-size="9" dy="3">12</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">0 Ω</tspan></text>
  <text x="620" y="422" font-size="12" fill="#0b0b0b" font-style="italic" text-anchor="end">V<tspan font-size="9" dy="3">A</tspan></text>

  <!-- R17: the measuring resistor -->
  <rect x="632" y="420" width="16" height="56" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="656" y="444" font-size="12" fill="#0b0b0b">R<tspan font-size="9" dy="3">17</tspan></text>
  <text x="656" y="461" font-size="10.5" fill="#52514e">52.3 Ω</text>

  <!-- C11 -->
  <g stroke="#1f1f1e" stroke-width="2"><line x1="690" y1="384" x2="690" y2="416"/><line x1="698" y1="384" x2="698" y2="416"/></g>
  <text x="694" y="374" font-size="12" fill="#0b0b0b" text-anchor="middle">C<tspan font-size="9" dy="3">11</tspan><tspan font-size="10.5" fill="#52514e" dx="3" dy="-3">1 nF</tspan></text>

  <!-- divider callout -->
  <rect x="512" y="232" width="206" height="56" rx="6" fill="#f6f6f4" stroke="#e4e3df"/>
  <text x="615" y="251" font-size="11" fill="#2a78d6" text-anchor="middle">measuring divider</text>
  <text x="615" y="273" font-size="13" fill="#0b0b0b" text-anchor="middle" font-style="italic">H = V<tspan font-size="10" dy="3">A</tspan><tspan dx="3" dy="-3">/ V</tspan><tspan font-size="10" dy="3">in</tspan><tspan dx="4" dy="-3">= R</tspan><tspan font-size="10" dy="3">17</tspan><tspan dx="3" dy="-3">/ (Z</tspan><tspan font-size="10" dy="3">q</tspan><tspan dx="4" dy="-3">+ R</tspan><tspan font-size="10" dy="3">17</tspan><tspan dy="-3">)</tspan></text>

  <!-- AD8302 -->
  <rect x="760" y="50" width="130" height="380" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="825" y="38" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="middle">AD8302</text>
  <text x="825" y="232" font-size="11" fill="#52514e" text-anchor="middle">gain / phase</text>
  <text x="825" y="246" font-size="11" fill="#52514e" text-anchor="middle">detector</text>
  <text x="825" y="266" font-size="9.5" fill="#8a8984" text-anchor="middle">measurement mode</text>
  <text x="768" y="84" font-size="11" fill="#0b0b0b">INPB</text>
  <text x="768" y="404" font-size="11" fill="#0b0b0b">INPA</text>
  <text x="882" y="166" font-size="11" fill="#0b0b0b" text-anchor="end">V<tspan font-size="9" dy="3">MAG</tspan></text>
  <text x="882" y="186" font-size="9.5" fill="#8a8984" text-anchor="end">30 mV/dB</text>
  <text x="882" y="306" font-size="11" fill="#0b0b0b" text-anchor="end">V<tspan font-size="9" dy="3">PHS</tspan></text>
  <text x="882" y="326" font-size="9.5" fill="#8a8984" text-anchor="end">10 mV/°</text>

  <!-- LM7301 non-inverting stages -->
  <g fill="#ffffff" stroke="#1f1f1e" stroke-width="1.6" stroke-linejoin="round">
    <path d="M930,148 L985,170 L930,192 z"/>
    <path d="M930,288 L985,310 L930,332 z"/>
  </g>
  <text x="938" y="174" font-size="10" fill="#0b0b0b">×2</text>
  <text x="936" y="314" font-size="10" fill="#0b0b0b">×1.5</text>
  <text x="957" y="138" font-size="10.5" fill="#0b0b0b" text-anchor="middle">U5 LM7301</text>
  <text x="957" y="210" font-size="10" fill="#52514e" text-anchor="middle">1 + R21/R23</text>
  <text x="957" y="278" font-size="10.5" fill="#0b0b0b" text-anchor="middle">U4 LM7301</text>
  <text x="957" y="350" font-size="10" fill="#52514e" text-anchor="middle">1 + R20/R22</text>

  <!-- Teensy ADC -->
  <rect x="1040" y="120" width="140" height="240" rx="6" fill="#f6f6f4" stroke="#3a3a38" stroke-width="1.6"/>
  <text x="1050" y="174" font-size="11" fill="#0b0b0b">A9</text>
  <text x="1050" y="314" font-size="11" fill="#0b0b0b">A3</text>
  <text x="1110" y="230" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Teensy 4.0</text>
  <text x="1110" y="250" font-size="11" fill="#52514e" text-anchor="middle">12-bit ADC, 3.3 V</text>
  <text x="1110" y="266" font-size="11" fill="#52514e" text-anchor="middle">N<tspan font-size="9" dy="3">MAG</tspan><tspan dy="-3">, N</tspan><tspan font-size="9" dy="3">PHS</tspan></text>
  <path d="M1110,360 V420" fill="none" stroke="#3a3a38" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1110" y="442" font-size="11" fill="#52514e" text-anchor="middle">USB to host:</text>
  <text x="1110" y="458" font-size="11" fill="#52514e" text-anchor="middle">M, φ → Z<tspan font-size="9" dy="3">q</tspan><tspan dx="4" dy="-3">→ G(f)</tspan></text>

  <text x="20" y="524" font-size="10" fill="#8a8984">After docs/schematic/openQCM_NEXT_A4.pdf (rev. 3.0). The measuring divider is drawn in blue.</text>
</svg>
